---
- name: "create ipsec conf files"
  ansible.builtin.template:
    src: connection.conf
    dest: "/etc/ipsec.d/{{ item.key }}.conf"
    mode: '0644'
  loop: "{{ present_ipsec_connections }}"
  register: ipsec_connections_creation
  notify: "{{ ipsec_handler }}"

- name: "create ipsec secrets files"
  ansible.builtin.template:
    src: connection.secrets
    dest: "/etc/ipsec.d/{{ item.key }}.secrets"
    mode: '0600'
  loop: "{{ present_ipsec_connections }}"
  register: ipsec_secrets_creation
  notify: "{{ ipsec_handler }}"

- name: "remove ipsec conf files"
  ansible.builtin.file:
    path: "/etc/ipsec.d/{{ item.key }}.conf"
    state: absent
  loop: "{{ absent_ipsec_connections }}"
  register: ipsec_connections_deletion
  notify: "{{ ipsec_handler }}"

- name: "remove ipsec secrets files"
  ansible.builtin.file:
    path: "/etc/ipsec.d/{{ item.key }}.secrets"
    state: absent
  loop: "{{ absent_ipsec_connections }}"
  register: ipsec_secrets_deletion
  notify: "{{ ipsec_handler }}"
